<style>
*,
*:before,
*:after {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
body {
    background-color: #15202C;
}
.background {
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}
form {
    width: 400px;
    background-color: rgba(255,255,255,0.13);
    position: absolute;
    transform: translate(-50%,-50%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 40px 35px;
}
form * {
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
}
form h3 {
    font-size: 32px;
    font-weight: 500;
    line-height: 32px;
    text-align: center;
}
input {
    display: block;
    height: 50px;
    width: 100%;
    background-color: rgba(255,255,255,0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 5px;
    font-size: 16px;
    font-weight: 300;
}
::placeholder {
    color: #AAA;
}
button {
    margin-top: 5px;
    width: 100%;
    background-color: #002244;
    color: #ffffff;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition:
        background-color 0.2s ease,
        transform 0.05s ease,
        box-shadow 0.05s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
}

button:hover {
    background-color: #003366;
}

button:active {
    transform: scale(0.98);
    box-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
}
</style>
</head>
<body>
    <form id="login-form">
        <h3>Restricted Area</h3>
        <input type="text" placeholder="Login" id="username" autocomplete="username">
        <input type="password" placeholder="Password" id="password" autocomplete="current-password">
        <button type="submit" id="login-btn">Login</button>
        <div id="login-error" style="color:#ff0000; margin:10px 0 0 0; min-height:22px; font-size:15px;"></div>
    </form>
    <script>
    const basePath = window.location.pathname;
    document.getElementById('login-form').onsubmit = async function(e) {
        e.preventDefault();
        var btn = document.getElementById('login-btn');
        var err = document.getElementById('login-error');
        btn.disabled = true;
        err.textContent = '';
        try {
            const res = await fetch(`${basePath}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            if (!res.ok) throw new Error(await res.text());
            window.location.href = basePath || '/';
        } catch (e) {
            err.textContent = 'Invalid username or password';
        }
        btn.disabled = false;
    };
    </script>
</body>
</html>
